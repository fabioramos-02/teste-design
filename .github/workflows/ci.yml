name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # pnpm ignora token com ${VAR} no .npmrc do projeto: a credencial vai no .npmrc do usuário
      - name: Autenticar no registry do GitLab MS
        run: |
          if [ -z "$GITLAB_MS_NPM_TOKEN" ]; then
            echo "::error::Secret GITLAB_MS_NPM_TOKEN não cadastrado. Rode: gh secret set GITLAB_MS_NPM_TOKEN"
            exit 1
          fi
          echo "//gitlabs.ms.gov.br/:_authToken=${GITLAB_MS_NPM_TOKEN}" >> ~/.npmrc
        env:
          GITLAB_MS_NPM_TOKEN: ${{ secrets.GITLAB_MS_NPM_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
